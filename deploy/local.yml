# Optional local mailbox; never enabled by production.py.
services:
  auth:
    environment:
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      # Pinned: whatever the env file says, local email only ever reaches Mailpit.
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_USER: ""
      GOTRUE_SMTP_PASS: ""
  web:
    build:
      args:
        # Local-only quick login; never set in compose.yml, bundle.py or CI.
        VITE_DEV_LOGIN: "true"
        VITE_DEV_LOGIN_PASSWORD: ${DEV_LOGIN_PASSWORD:?Run scripts/local.sh up to generate DEV_LOGIN_PASSWORD}
  mailpit:
    restart: unless-stopped
    platform: linux/arm64
    mem_limit: 64m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: [CMD, /mailpit, readyz]
      interval: 5s
      timeout: 3s
      retries: 10
    image: axllent/mailpit:v1.30.2
    ports:
      - 127.0.0.1:8025:8025
