name: CI
on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: http://localhost:8000
      VITE_SUPABASE_ANON_KEY: sb_publishable_ci_build_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - name: Deployment script tests
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Database authorization and concurrency tests
        run: npm run test:db
# No Docker image publishing, browser download, artifacts or deployment wait.
# EC2 polls main and deploys only the SHA with a successful run of this workflow.
